<!doctype html>
<html lang="zh-Hant-TW" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>甜點社報帳</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&family=Source+Sans+3:wght@400..700&family=Noto+Sans+TC:wght@400..700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="glyphField" aria-hidden="true" hidden></canvas>

  <section class="landing" id="signedOut">
    <div class="motes" id="landingMotes" aria-hidden="true"></div>
    <header class="landing-top">
      <span class="brand">成功大學甜點社</span>
      <span class="mono">DESSERT TREASURER</span>
    </header>
    <div class="landing-body">
      <p class="eyebrow-row">
        <span class="mono eyebrow">CLUB LEDGER</span>
        <span class="lede">報帳、追蹤審核進度、查看社團財務</span>
      </p>
      <h1>NCKU<br>Dessert Club</h1>
      <div id="signInButton"></div>
    </div>
    <div class="art landing-art" id="landingArt" aria-hidden="true"></div>
  </section>

  <div id="app" hidden>
    <div id="scrim" hidden></div>
    <nav id="drawer" aria-label="功能列">
      <div class="drawer-head">
        <span class="brand">甜點社</span>
        <span class="mono">DESSERT TREASURER</span>
      </div>
      <ul>
        <li><button type="button" data-nav="overview">總覽<span class="mono">Overview</span></button></li>
        <li><button type="button" data-nav="myClaims">我的申請<span class="mono">My claims</span></button></li>
        <li><button type="button" data-nav="claimForm">新增報帳<span class="mono">New claim</span></button></li>
        <li id="navReview" hidden><button type="button" data-nav="review">審核報帳<span class="mono">Review</span></button></li>
      </ul>
      <div class="drawer-foot">
        <p class="user-label"><span class="subtle" id="userRole"></span><strong id="userName"></strong></p>
        <button type="button" class="mode-switch" id="themeToggle" role="switch" aria-label="深色模式" aria-checked="false">
          <span class="mode-thumb"></span>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="link" id="signOut">登出</button>
      </div>
    </nav>

    <div class="shell">
      <header class="topbar">
        <button type="button" class="icon" id="menuButton" aria-label="開啟功能列" aria-expanded="false" aria-controls="drawer">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <span class="brand">甜點社</span>
        <span class="mono" id="viewLabel"></span>
      </header>

      <main>
        <div id="overview" hidden>
          <section class="hero" aria-labelledby="heroLabel">
            <p class="eyebrow" id="heroLabel">帳面餘額<span id="heroSynced"></span></p>
            <p class="hero-number" id="heroBalance">—</p>
            <div class="stats">
              <div class="stat" data-label="本月收入" hidden><span>本月收入</span><strong></strong></div>
              <div class="stat" data-label="本月支出" hidden><span>本月支出</span><strong></strong></div>
              <div class="stat" id="heroReview" hidden><span>待審核</span><button type="button" class="link" data-nav="review"></button></div>
            </div>
          </section>
          <section class="card" aria-labelledby="spendingTitle">
            <h2 id="spendingTitle">支出分布</h2>
            <div class="art-row">
              <div class="art" id="cakeArt" aria-hidden="true"></div>
              <dl class="legend" id="cakeLegend"></dl>
            </div>
            <p class="subtle" id="summaryEmpty" hidden>尚未同步。總務在記帳 app 同步後，這裡會顯示社團財務。</p>
          </section>
        </div>

        <div id="myClaims" hidden>
          <section class="card" aria-labelledby="claimsTitle">
            <div class="list-head">
              <h2 id="claimsTitle">我的申請</h2>
              <span class="count" id="claimsCount" aria-live="polite"></span>
            </div>
            <p class="subtle claims-empty" id="claimsEmpty" hidden>還沒有送出過報帳。</p>
            <ul class="claims my-claims" id="claimList"></ul>
          </section>
        </div>

        <form class="card" id="claimForm" hidden novalidate>
          <h2>新增報帳<span class="mono">New claim</span></h2>
          <label for="claimDateButton">消費日期</label>
          <div class="date-field">
            <input id="claimDate" type="hidden">
            <button type="button" class="date-button" id="claimDateButton" aria-haspopup="dialog" aria-expanded="false"></button>
            <div class="calendar" id="claimCalendar" role="dialog" aria-label="選擇消費日期" hidden>
              <div class="calendar-head">
                <button type="button" class="icon" id="calendarPrev" aria-label="上個月">‹</button>
                <button type="button" class="calendar-title" id="calendarMonth" aria-live="polite"></button>
                <button type="button" class="icon" id="calendarNext" aria-label="下個月">›</button>
              </div>
              <div class="calendar-grid calendar-weekdays" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
              <div class="calendar-grid" id="calendarDays"></div>
              <div class="calendar-months" id="calendarMonths" hidden></div>
              <div class="calendar-foot"><button type="button" class="link" id="calendarToday">今天</button></div>
            </div>
          </div>

          <label for="claimAmount">金額</label>
          <input id="claimAmount" type="number" inputmode="numeric" min="1" step="1" required>

          <label for="claimParent">主項目</label>
          <div class="picker">
            <select id="claimParent" required></select>
            <input id="claimParentOther" aria-label="自訂主項目" placeholder="輸入自訂主項目" autocomplete="off" hidden>
            <button type="button" class="picker-back" data-picker="claimParent" aria-label="改回主項目選單" hidden>選單</button>
          </div>

          <label for="claimChild">副項目</label>
          <div class="picker">
            <select id="claimChild" required></select>
            <input id="claimChildOther" aria-label="自訂副項目" placeholder="輸入自訂副項目" autocomplete="off" hidden>
            <button type="button" class="picker-back" data-picker="claimChild" aria-label="改回副項目選單" hidden>選單</button>
          </div>

          <label for="claimActivity">活動／社課<span class="subtle">（選填）</span></label>
          <input id="claimActivity" maxlength="60" autocomplete="off">

          <label for="claimVendor">店家<span class="subtle">（選填）</span></label>
          <input id="claimVendor" maxlength="60" autocomplete="off" placeholder="例如：全聯、網購">

          <label for="claimDescription">說明<span class="subtle">（選填）</span></label>
          <textarea id="claimDescription" maxlength="300" rows="3"></textarea>

          <label for="claimFiles" class="split-label">
            <span>收據照片或 PDF<span class="subtle">（選填）</span></span>
            <span class="subtle" id="claimFilesHint"></span>
          </label>
          <input id="claimFiles" type="file" accept="image/*,application/pdf" multiple>

          <div class="actions">
            <button type="button" id="claimCancel">取消</button>
            <button type="submit" class="primary" id="claimSubmit">送出</button>
          </div>
        </form>

        <div id="review" hidden>
          <section class="card" aria-labelledby="reviewTitle">
            <div class="list-head review-head">
              <h2 id="reviewTitle">報帳申請</h2>
              <div class="list-filters">
                <select id="reviewPosition" aria-label="依職位篩選"><option value="">全部職位</option></select>
                <select id="reviewStatus" aria-label="依狀態篩選">
                  <option value="待審核">待審核</option>
                  <option value="已核准">已核准</option>
                  <option value="退回">退回</option>
                  <option value="已付款">已付款</option>
                  <option value="">全部</option>
                </select>
              </div>
              <p class="subtle" id="reviewSummary" aria-live="polite"></p>
            </div>
            <ul class="claims review-claims" id="reviewList"></ul>
          </section>
        </div>

        <div id="detail" hidden>
          <button type="button" class="link back" id="detailBack">‹ 返回清單</button>
          <section class="card" aria-labelledby="detailTitle">
            <h2 id="detailTitle">申請內容<span class="mono">Claim</span></h2>
            <dl class="fields" id="detailFields"></dl>
          </section>
          <section class="card" aria-labelledby="receiptsTitle">
            <h2 id="receiptsTitle">收據<span class="mono">Receipts</span></h2>
            <div id="detailAttachments"></div>
          </section>
          <section class="card" id="detailActions">
            <div id="reviewControls">
              <label for="reviewNote">審核備註<span class="subtle">（退回時必填）</span></label>
              <textarea id="reviewNote" maxlength="300" rows="2"></textarea>
              <label for="reviewNextStatus">改為</label>
              <div class="status-row">
                <select id="reviewNextStatus"></select>
                <button type="button" class="primary" id="applyStatus">更新狀態</button>
              </div>
              <p class="subtle" id="statusHint" hidden></p>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <p id="message" role="status" aria-live="polite" hidden></p>

  <script src="config.js"></script>
  <script src="art.js"></script>
  <script src="app.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer onload="startSignIn()"></script>
</body>
</html>

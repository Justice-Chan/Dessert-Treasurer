[package]
name = "dessert-treasurer"
version = "0.2.0"
description = "甜點社總務記帳與報銷工具"
authors = ["Dessert Treasurer"]
edition = "2024"

[lib]
name = "dessert_treasurer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

name: Build Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build:web
      - run: npm run test:build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm run test:ui
      - run: npm run build:windows
      - name: Write installer checksums
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe")
          if ($installers.Count -eq 0) { throw "No Windows installer was produced." }
          $installers | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: dessert-treasurer-windows-x64-${{ github.sha }}
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sha256
          if-no-files-found: error
          retention-days: 14
